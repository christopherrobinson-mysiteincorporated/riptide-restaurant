 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu - Riptide</title>
    <link rel="stylesheet" href="styles.css">
    <style>
    /* --- HEADER RESTORATION --- */
    .topnav {
        display: flex;
        align-items: center;
        padding: 10px 20px;
        /* Removed background-color so your image shows */
    }

    /* This keeps the "Explore" and "Contact" links spaced out */
    .divider {
        width: 1px;
        height: 20px;
        background-color: rgba(255, 255, 255, 0.3); /* Subtle white line */
        margin: 0 15px;
    }

    .contact-link {
        text-decoration: none;
        color: inherit; /* Takes color from your styles.css */
        margin: 0;
    }

    /* Dropdown Styling */
    .dropdown { position: relative; display: inline-block; }
    .dropbtn {
        background: none;
        border: none;
        font-size: 16px;
        cursor: pointer;
        color: inherit;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: white;
        min-width: 160px;
        box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
        z-index: 10;
    }
    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }
    .dropdown:hover .dropdown-content { display: block; }

    /* --- MENU IMAGE FIX --- */
    .menu-display {
        display: flex;
        flex-direction: column; 
        align-items: center;
        gap: 30px;
        padding: 20px;
    }

    .menu-page {
        max-width: 90%;     /* Fits screen width */
        width: 1000px;      /* Bigger for better readability */
        height: auto;       
        border-radius: 4px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    main { text-align: center; }
</style>

</head>
<body>

    <header>
        <nav class="topnav">
            <div class="dropdown">
                <button class="dropbtn">Explore ▾</button>
                <div class="dropdown-content">
                    <a href="index.html">Home</a>
                    <a href="livemusic.html">Event calendar</a>
                    <a href="carrer2.html">Careers</a>
                    <a href="gallery.html">Gallery</a>
                </div>
            </div>

            <div class="divider"></div>

            <p id="contactheader" class="contact-link">contact info:</p>
            
            <div class="divider"></div>
            <a id="maps" class="contact-link" href="https://www.google.com/maps?q=38+Ocean+Ave,+West+Haven,+CT+06516" target="_blank">38 Ocean Ave, West Haven, CT 06516</a>
            <div class="divider"></div>


            <a id="phone" class="contact-link" href="tel:+12033905918">Call us 203-390-5918</a>

            <div class="divider"></div>

            <a id="fb" class="contact-link" href="https://www.facebook.com/riptidewesthaven/">Facebook</a>
            <div class="divider"></div>
            <a id ="ig" class="contact-link" href="https://www.instagram.com/riptidewesthaven/" target="_blank">Instagram</a>

        </nav>
    </header>

    <main>
        <h1>Our Menu</h1>
        
        <div class="menu-display">
            <img src="menu1.jpg" alt="Menu Front Page" class="menu-page">
            <img src="menu2.jpg" alt="Menu Back Page" class="menu-page">
        </div>

  height="1000px"

</div>

</div>

</html>
