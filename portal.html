 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riptide Management Portal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b1126; color: #fff; padding: 30px; margin: 0; }
        .admin-container { max-width: 1100px; margin: auto; }
        h1 { text-align: center; color: #c8a96e; border-bottom: 2px solid #c8a96e; padding-bottom: 10px; }
        .dashboard-section { background: #121b3a; padding: 25px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #23315d; }
        h2 { color: #c8a96e; border-left: 4px solid #c8a96e; padding-left: 10px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        input, textarea, select { padding: 10px; margin-top: 5px; border-radius: 6px; background: #0b1126; color: #fff; border: 1px solid #23315d; }
        button { background: #c8a96e; color: #0b1126; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 6px; margin-right: 5px; }
        
        /* SCROLLABLE CANVAS CONTAINER */
        #canvas-playground { 
            width: 100%; height: 600px; background: #fff; 
            border: 2px dashed #c8a96e; position: relative; 
            margin-top: 15px; overflow-y: auto; overflow-x: hidden;
        }
        #prop-panel { background: #23315d; padding: 15px; border-radius: 6px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>⚓ Riptide Client Control Portal</h1>

    <div class="dashboard-section">
        <h2>Update Main Menu Sheets</h2>
        <form id="menu-upload-form">
            <div class="form-group"><label>Front Page</label><input type="file" id="menuFront" accept="image/*"></div>
            <div class="form-group"><label>Back Page</label><input type="file" id="menuBack" accept="image/*"></div>
            <button type="submit">Push Menu Images Live</button>
        </form>
    </div>

    <div class="dashboard-section">
        <h2>Add Today's Menu Special</h2>
        <form id="specials-form">
            <div class="form-group"><label>Item Name</label><input type="text" id="special-title" required></div>
            <div class="form-group"><label>Price</label><input type="text" id="special-price" required></div>
            <div class="form-group"><label>Description</label><textarea id="special-desc" rows="3"></textarea></div>
            <button type="submit">Publish Special</button>
        </form>
    </div>

    <div class="dashboard-section">
        <h2>Interactive Gallery Canvas Layout</h2>
        <button id="add-text-btn">➕ Add Text</button>
        
        <input type="file" id="img-upload" accept="image/*" style="display:none">
        <button onclick="document.getElementById('img-upload').click()">🖼️ Add Local Image</button>
        
        <button id="save-layout-btn" style="background:#27ae60; color:white;">🚀 Publish to Supabase</button>
        
        <div id="prop-panel">
            <input type="text" id="prop-text" placeholder="Edit Text">
            <select id="prop-font">
                <option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Courier New">Courier</option>
            </select>
            <input type="number" id="prop-size" placeholder="Size (px)">
            <input type="color" id="prop-color">
        </div>
        <div id="canvas-playground"></div>
    </div>
</div>

<script>
    let activeElement = null;

    // Add Text Logic
    document.getElementById('add-text-btn').addEventListener('click', () => {
        const div = document.createElement('div');
        div.contentEditable = true;
        div.innerText = "New Text";
        div.style.position = "absolute";
        div.style.cursor = "move";
        div.style.left = "20px"; div.style.top = "20px";
        div.onclick = (e) => { activeElement = e.target; };
        document.getElementById('canvas-playground').appendChild(div);
    });

    // Local Image Upload Logic
    document.getElementById('img-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = document.createElement('img');
                img.src = event.target.result;
                img.style.width = "150px";
                img.style.position = "absolute";
                img.style.cursor = "move";
                img.onclick = (e) => { activeElement = e.target; };
                document.getElementById('canvas-playground').appendChild(img);
            };
            reader.readAsDataURL(file);
        }
    });

    // Property Panel Sync
    ['prop-text', 'prop-font', 'prop-size', 'prop-color'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
            if (!activeElement || activeElement.tagName === 'IMG') return;
            if (id === 'prop-text') activeElement.innerText = e.target.value;
            if (id === 'prop-font') activeElement.style.fontFamily = e.target.value;
            if (id === 'prop-size') activeElement.style.fontSize = e.target.value + 'px';
            if (id === 'prop-color') activeElement.style.color = e.target.value;
        });
    });

    // Save to Supabase
    document.getElementById('save-layout-btn').addEventListener('click', async () => {
        const items = Array.from(document.getElementById('canvas-playground').children).map(el => ({
            html: el.outerHTML,
            style: el.getAttribute('style')
        }));
        await fetch('/.netlify/functions/save-data', {
            method: 'POST',
            body: JSON.stringify({ layout: items })
        });
        alert("Layout Published to Supabase!");
    });
</script>
</body>
</html>
